#@TYPE: Machine
#@NAME: kv260
#@DESCRIPTION: Machine support for Kria KV260 Vision AI Starter Kit customized for LmP

DEFAULTTUNE = "cortexa53"
SOC_VARIANT = "ev"

# Set MACHINEOVERRIDES manually instead of using BOARD / BOARD_VARIANT (now deprecated)
MACHINEOVERRIDES =. "k26:k26-kv:"

# Carriers are configured via overlays
UBOOT_DTBO_LOADADDRESS ?= "0x40100000"

# Build boot.scr for compatibility with the stock firmware
WKS_FILE_DEPENDS:append:lmp-base = " u-boot-ostree-scr"
IMAGE_BOOT_FILES:append:lmp-base = " boot.scr uEnv.txt"

require conf/machine/include/zynqmp-lmp.inc

# Add system XSA from Xilinx
HDF_URI = "https://petalinux.xilinx.com/sswreleases/rel-v2024.2/hdf-examples/2024.2/2024.2_1111_1_12031048/external/k26-smk-kv/k26-smk-kv-2024.2_1111_1.xsa"
HDF_URI[sha256sum] = "c6d5b1348254a1c516874ff5843d9b12e358094f5541f89c220970e88b2be199"

# Configuration Settings
# From xilinx-kv260-starterkit-xsct-2024.2/project-spec/configs/config

# Yocto device-tree variables
YAML_CONSOLE_DEVICE_CONFIG:pn-device-tree ?= "psu_uart_1"
YAML_MAIN_MEMORY_CONFIG:pn-device-tree ?= "psu_ddr_0"
DT_PADDING_SIZE:pn-device-tree ?= "0x1000"
# Enable DT Overlay
DTC_FLAGS:pn-device-tree ?= " -@"

# Yocto PMUFW variables
extra_settings:pn-pmu-firmware = ""
YAML_COMPILER_FLAGS:append:pn-pmu-firmware = " ${extra_settings}"
YAML_SERIAL_CONSOLE_STDIN:pn-pmu-firmware = "psu_uart_1"
YAML_SERIAL_CONSOLE_STDOUT:pn-pmu-firmware = "psu_uart_1"

# Serial Console Settings
SERIAL_CONSOLES = "115200;ttyPS1"
YAML_SERIAL_CONSOLE_BAUDRATE = "115200"

# Yocto arm-trusted-firmware(TF-A) variables
ATF_CONSOLE ?= "cadence1"
TFA_BL33_LOAD ?= "0x8000000"

# Yocto MACHINE_FEATURES Variable
MACHINE_FEATURES += "mali400"

## LmP Settings

OSTREE_KERNEL_ARGS ?= "console=ttyPS1,115200 clk_ignore_unused uio_pdrv_genirq.of_id=generic-uio xilinx_tsn_ep.st_pcp=4 cma=900M ${OSTREE_KERNEL_ARGS_COMMON}"

# bitstream support
MACHINE_FIRMWARE:append = " fpga-manager-script"
MACHINE_EXTRA_RRECOMMENDS += "${MACHINE_FIRMWARE}"
SPL_FPGA_BINARY = "bitstream.bit.bin"
SPL_FPGA_LOAD_ADDR = "0x18000000"

# Make image-update essential as it is required for bootfw updates
MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "image-update"

# SOM has infineon slb9670
MACHINE_FEATURES += "tpm2"
